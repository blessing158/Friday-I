<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Friday AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- TOP BAR -->

  <div class="topbar">

    <div class="left">

      <button id="menuBtn">
        ⋮
      </button>

      <h1>Friday AI</h1>

    </div>

  </div>

  <!-- MENU -->

  <div id="menu" class="hidden">

    <p>New Chat</p>

    <p>Settings</p>

    <p>About</p>

  </div>

  <!-- CHAT AREA -->

  <div id="chatbox"></div>

  <!-- INPUT AREA -->

  <div class="input-area">

    <input
      type="text"
      id="userInput"
      placeholder="Message Friday..."
    >

    <button
      id="sendBtn"
      onclick="sendMessage()"
    >
      ➜
    </button>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
